<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071927"/>
      <stop offset="100%" stop-color="#0e3046"/>
    </linearGradient>
    <linearGradient id="helix1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="helix2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>
  <rect width="64" height="64" rx="16" fill="none" stroke="#2dd4bf" stroke-width="1.5" stroke-opacity="0.3"/>
  
  <!-- Base pair rungs -->
  <line x1="22" y1="18" x2="42" y2="18" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="25" y1="25" x2="39" y2="25" stroke="#2dd4bf" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <line x1="28" y1="32" x2="36" y2="32" stroke="#818cf8" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
  <line x1="25" y1="39" x2="39" y2="39" stroke="#2dd4bf" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <line x1="22" y1="46" x2="42" y2="46" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>

  <!-- Helix strand 1 -->
  <path d="M 22 18 C 30 25, 34 25, 42 32 C 34 39, 30 39, 22 46" 
        fill="none" stroke="url(#helix1)" stroke-width="3.5" stroke-linecap="round" filter="url(#glow)"/>
  
  <!-- Helix strand 2 -->
  <path d="M 42 18 C 34 25, 30 25, 22 32 C 30 39, 34 39, 42 46" 
        fill="none" stroke="url(#helix2)" stroke-width="3.5" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Glowing node points -->
  <circle cx="22" cy="18" r="3" fill="#2dd4bf"/>
  <circle cx="42" cy="18" r="3" fill="#38bdf8"/>
  <circle cx="32" cy="32" r="3.5" fill="#5eead4"/>
  <circle cx="22" cy="46" r="3" fill="#38bdf8"/>
  <circle cx="42" cy="46" r="3" fill="#818cf8"/>
</svg>
